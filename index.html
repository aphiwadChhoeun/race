<html lang="en">

    <meta charset="UTF-8" />

    <title>Snail Dash</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Baloo 2 is the chunky rounded face the cartoon theme is drawn around.
         `display=swap` means a blocked or slow font never delays first paint —
         the page renders in the rounded system fallback and swaps when it
         arrives, so the game is playable offline, just less bubbly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
